---
# Pullbox Release Pipeline
# Creates or updates a GitHub Release after the Docker Release workflow
# publishes, signs, and verifies images for a tagged commit.
# GitHub Actions is the canonical release creator for current tag pushes.
#
# Security: All actions pinned to full SHA.
# See: docs/development/INFRASTRUCTURE.md
# Trusted release automation stays on the dedicated CI runner. Image publishing
# stays isolated in the Docker Release workflow.
#
# Pre-release detection: hyphenated tags such as v1.0.0-rc1.

name: Release

on:
  workflow_run:
    workflows: ["Docker Release"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.event || github.event_name }}-${{ github.event.workflow_run.head_sha || github.sha || github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: [self-hosted, Linux, X64, ci]
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download release image metadata artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-image-digest
          path: release-image-digest
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release tag
        id: release
        run: |
          TAG_FILE="release-image-digest/tag.txt"
          if [ ! -f "${TAG_FILE}" ]; then
            echo "::error::Docker Release workflow did not publish ${TAG_FILE}."
            exit 1
          fi

          TAG=$(tr -d '[:space:]' < "${TAG_FILE}")
          if ! [[ "${TAG}" =~ ^v.+ ]]; then
            echo "::error::Unexpected release tag format from Docker Release artifact: ${TAG}"
            exit 1
          fi

          TAG_SHA=$(git rev-list -n 1 "${TAG}")
          if [ "${TAG_SHA}" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "::error::Release tag ${TAG} points at ${TAG_SHA}, not Docker Release SHA ${{ github.event.workflow_run.head_sha }}."
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract version info
        if: steps.release.outputs.skip != 'true'
        id: version
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract curated changelog section
        if: steps.release.outputs.skip != 'true'
        run: |
          python3 scripts/extract_changelog_section.py \
            --version "${{ steps.release.outputs.version }}" \
            --output curated_changelog.md

      - name: Validate release image digest
        if: steps.release.outputs.skip != 'true'
        id: image-digest
        run: |
          DIGEST_FILE="release-image-digest/digest.txt"
          if [ ! -f "${DIGEST_FILE}" ]; then
            echo "::error::Docker Release workflow did not publish ${DIGEST_FILE}."
            exit 1
          fi

          DIGEST=$(tr -d '[:space:]' < "${DIGEST_FILE}")
          if ! [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected release image digest format: ${DIGEST}"
            exit 1
          fi

          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        if: steps.release.outputs.skip != 'true'
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${{ steps.release.outputs.tag }}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          COMMIT_SUBJECTS=$(git log "$RANGE" --pretty=format:"%s" --no-merges)

          category_notes() {
            local pattern="$1"
            local replacement="$2"
            printf '%s\n' "$COMMIT_SUBJECTS" | grep -E ".+" | grep -E "$pattern" | sed -E "$replacement" || true
          }

          {
            echo "## What's Changed"
            echo ""
            cat curated_changelog.md
            echo ""
            echo "## Commit Details"
            echo ""

            FEATS=$(category_notes '^feat(\(.+\))?: ' 's/^feat(\(.+\))?: /- /')
            if [ -n "$FEATS" ]; then
              echo "### ✨ Features"
              echo "$FEATS"
              echo ""
            fi

            FIXES=$(category_notes '^fix(\(.+\))?: ' 's/^fix(\(.+\))?: /- /')
            if [ -n "$FIXES" ]; then
              echo "### 🐛 Bug Fixes"
              echo "$FIXES"
              echo ""
            fi

            TESTS=$(category_notes '^test(\(.+\))?: ' 's/^test(\(.+\))?: /- /')
            if [ -n "$TESTS" ]; then
              echo "### 🧪 Testing"
              echo "$TESTS"
              echo ""
            fi

            REFACTORS=$(category_notes '^refactor(\(.+\))?: ' 's/^refactor(\(.+\))?: /- /')
            if [ -n "$REFACTORS" ]; then
              echo "### ♻️ Refactors"
              echo "$REFACTORS"
              echo ""
            fi

            DOCS=$(category_notes '^docs(\(.+\))?: ' 's/^docs(\(.+\))?: /- /')
            if [ -n "$DOCS" ]; then
              echo "### 📝 Docs"
              echo "$DOCS"
              echo ""
            fi

            CHORES=$(category_notes '^chore(\(.+\))?: ' 's/^chore(\(.+\))?: /- /')
            if [ -n "$CHORES" ]; then
              echo "### 🧰 Chores"
              echo "$CHORES"
              echo ""
            fi

            CI_CHANGES=$(category_notes '^ci(\(.+\))?: ' 's/^ci(\(.+\))?: /- /')
            if [ -n "$CI_CHANGES" ]; then
              echo "### 🏗️ CI / Build"
              echo "$CI_CHANGES"
              echo ""
            fi

            PERF=$(category_notes '^perf(\(.+\))?: ' 's/^perf(\(.+\))?: /- /')
            if [ -n "$PERF" ]; then
              echo "### ⚡ Performance"
              echo "$PERF"
              echo ""
            fi

            STYLES=$(category_notes '^style(\(.+\))?: ' 's/^style(\(.+\))?: /- /')
            if [ -n "$STYLES" ]; then
              echo "### 🎨 Style / UI Polish"
              echo "$STYLES"
              echo ""
            fi

            OTHER=$(printf '%s\n' "$COMMIT_SUBJECTS" | grep -E ".+" | grep -Ev "^(feat|fix|test|refactor|docs|chore|ci|perf|style)(\(.+\))?: |^Merge" | sed 's/^/- /' || true)
            if [ -n "$OTHER" ]; then
              echo "### 🔧 Other Changes"
              echo "$OTHER"
              echo ""
            fi

            echo "## 🐳 Docker Images"
            echo ""
            echo '```bash'
            echo "docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}"
            echo "docker pull docker.io/pullbox/pullbox:${{ steps.version.outputs.version }}"
            echo '```'
            echo ""
            echo "**Digest:** \`${{ steps.image-digest.outputs.digest }}\`"
            echo ""
            echo "## 🔐 Image Verification"
            echo ""
            echo "Release images are signed with keyless Sigstore/Cosign using GitHub Actions OIDC."
            echo "These commands verify the exact multi-architecture image digest published by this release."
            echo ""
            echo '```bash'
            echo "cosign verify \\"
            echo "  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/\\.github/workflows/docker-release\\.yml@refs/tags/${{ steps.version.outputs.tag }}$' \\"
            echo "  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\"
            echo "  ghcr.io/${{ github.repository }}@${{ steps.image-digest.outputs.digest }}"
            echo ""
            echo "cosign verify \\"
            echo "  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/\\.github/workflows/docker-release\\.yml@refs/tags/${{ steps.version.outputs.tag }}$' \\"
            echo "  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\"
            echo "  docker.io/pullbox/pullbox@${{ steps.image-digest.outputs.digest }}"
            echo '```'
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG:-$(git rev-list --max-parents=0 HEAD | head -1)}...${{ steps.release.outputs.tag }}"
          } > release_notes.md

      - name: Create GitHub Release
        if: steps.release.outputs.skip != 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: "Pullbox ${{ steps.version.outputs.tag }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
