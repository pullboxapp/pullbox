---
# Pullbox Clean-Room Verification
# Fresh install sanity lane to catch cache-masked dependency or environment
# drift without slowing normal PR CI.
# Legacy/manual fallback. The scheduled clean-room lane is disabled.

name: Clean Room

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-room-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  fresh-install:
    name: Fresh Install Verification
    runs-on: ${{ fromJSON(vars.PULLBOX_CHECKS_RUNNER == 'github-hosted' && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","ci"]') }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Runner preflight
        run: .github/scripts/preflight-runner.sh python node

      - name: Create clean-room venv
        run: |
          VENV_PATH="/tmp/pullbox-clean-room-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python -m venv "${VENV_PATH}"
          echo "VENV_PATH=${VENV_PATH}" >> "$GITHUB_ENV"
          echo "${VENV_PATH}/bin" >> "$GITHUB_PATH"

      - name: Install clean-room dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e ".[dev]"
          npm ci

      - name: Lint
        run: ruff check src/ tests/

      - name: Format
        run: ruff format --check src/ tests/

      - name: Type check
        run: mypy src/pullbox/

      - name: Unit tests
        env:
          PULLBOX_SECRET_KEY: test-ci-key
        run: pytest tests/unit/ -n 4 -q

      - name: Cleanup
        if: always()
        run: rm -rf "${VENV_PATH:-}"
