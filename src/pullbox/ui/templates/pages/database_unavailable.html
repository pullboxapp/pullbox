<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library temporarily unavailable | Pullbox</title>
  <link rel="stylesheet" href="/static/css/tailwind.css">
</head>
<body class="min-h-screen grid place-items-center p-6">
  <main class="max-w-lg space-y-4">
    <h1 class="text-2xl font-semibold">Library temporarily unavailable</h1>
    <p>{{ message }}</p>
    {% if can_reload %}
    <a class="btn-primary" href="">Retry this page</a>
    {% endif %}
  </main>
</body>
</html>
