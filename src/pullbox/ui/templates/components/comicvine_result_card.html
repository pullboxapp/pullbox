{% macro comicvine_result_card(card_id, testid, is_static=false) %}
<article id="{{ card_id }}" data-testid="{{ testid }}"
         data-comicvine-result-card-contract="v1"
         class="add-series-result-card{% if is_static %} add-series-result-card-static{% endif %}">
  {{ caller("cover") }}
  <div class="min-w-0 flex-1">
    <div class="add-series-result-main">
      <div class="min-w-0 flex-1">
        {{ caller("details") }}
      </div>
      <div class="add-series-result-actions">
        {{ caller("actions") }}
      </div>
    </div>
  </div>
</article>
{% endmacro %}

{% macro comicvine_in_library_badge() %}
<span class="pill pill-success">
  <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
  </svg>
  In Library
</span>
{% endmacro %}
