{% from "components/dropdown_select.html" import dropdown_select %}
<div class="flex flex-wrap gap-2">
  <button type="button" class="btn-ghost btn-sm" :aria-pressed="!allFields" @click="allFields = false">Differences</button>
  <button type="button" class="btn-ghost btn-sm" :aria-pressed="allFields" @click="allFields = true">All fields</button>
  <button type="button" class="btn-ghost btn-sm" :disabled="busy" @click="selectEditorFields(true)">Select all eligible</button>
  <button type="button" class="btn-ghost btn-sm" :disabled="busy" @click="selectEditorFields(false)">Deselect all</button>
</div>
<fieldset class="space-y-2" x-show="checkedEditorFields().length" x-cloak>
  <legend class="field-label">Use a document for checked fields</legend>
  <p class="text-xs text-pb-text-sec">Fields without a usable value in that document keep their current choice. Update the preview to review your changes.</p>
  <div class="flex flex-wrap gap-2">
    <template x-for="doc in ['ComicInfo.xml', 'MetronInfo.xml']" :key="doc">
      <button type="button" class="btn-ghost btn-sm" :disabled="busy || !pendingDocumentFields(doc).length" @click="useEditorDocument(doc)" x-text="'Use ' + doc"></button>
    </template>
  </div>
  <p class="text-xs text-pb-text-sec" role="status" x-text="editorDocumentSummary()"></p>
</fieldset>
<p class="text-sm text-pb-text-sec" x-show="!editorFields().length">No differences to review.</p>
<template x-for="field in editorFields()" :key="field.key">
  <fieldset class="rounded-lg border border-pb-border p-3 space-y-2 min-w-0">
    <legend class="text-sm font-semibold text-pb-text px-1" x-text="field.label"></legend>
    <p class="text-xs text-pb-text-sec" x-show="field.overridden">Manual correction</p>
    <p class="text-sm text-pb-text whitespace-pre-wrap break-words max-h-32 overflow-y-auto" x-text="(field.key.startsWith('xml.') ? 'Embedded: ' : 'Library: ') + (editorValueLabel(field, field.current) || 'Not set')"></p>
    <p class="text-xs text-pb-text-sec" x-show="field.current_source_label" x-text="field.current_source_label ? 'Saved source: ' + field.current_source_label : ''"></p>
    <p class="text-sm text-pb-text whitespace-pre-wrap break-words max-h-32 overflow-y-auto" x-show="field.selected && !choicesDirty" x-text="'Approved preview: ' + (editorValueLabel(field, field.proposed) || 'Cleared')"></p>
    <p class="text-xs text-pb-text-sec" x-show="field.reason" x-text="field.reason"></p>
    <template x-if="field.editable && editorDrafts[field.key]">
      <div class="space-y-2">
        <label class="flex items-center gap-2 text-sm text-pb-text">
          <input type="checkbox" class="checkbox-pb" :aria-label="'Update ' + field.label" x-model="editorDrafts[field.key].selected" @change="choicesDirty = true" :disabled="busy">
          <span x-text="'Update ' + field.label"></span>
        </label>
        <div x-show="editorDrafts[field.key].selected" class="space-y-2">
          <label class="field-label" :for="fieldIdPrefix + 'source-' + field.key" x-text="'Value source for ' + field.label"></label>
          {{ dropdown_select(name="issue-editor-source", trigger_id_expression="fieldIdPrefix + 'source-' + field.key", local_model="editorDrafts[field.key].source", options_expression="editorOptions(field)", local_on_change="choicesDirty = true", disabled_expression="busy") }}
          <template x-for="option in field.options" :key="option.source">
            <p class="text-sm text-pb-text whitespace-pre-wrap break-words max-h-32 overflow-y-auto" x-show="editorDrafts[field.key].source === option.source || option.selectable === false" x-text="option.selectable === false ? option.source + ': ' + option.value + ' (no exact equivalent)' : editorValueLabel(field, option.value) || 'Not set'"></p>
          </template>
          <p class="text-sm text-pb-warning" x-show="editorDrafts[field.key].source === 'clear'" x-text="field.key === 'issue.web_links' ? 'Clears the descriptive links in both documents. Protected provider links stay in place.' : 'This deliberately removes the value and keeps it empty during refresh.'"></p>
          <p class="text-sm text-pb-text-sec" x-show="editorDrafts[field.key].source === 'reset'">Keep the current value now and allow future provider refreshes to update it.</p>
          <p class="text-sm text-pb-warning" x-show="editorDrafts[field.key].source === 'reset' && !choicesDirty && preview && (preview.conflicts || []).some(c => c.key === field.key || c.key === field.xml_conflict_key)">This field has conflicting values. Choose which value to keep and apply it first, then remove the override.</p>
          <div x-show="editorDrafts[field.key].source === 'custom'" class="space-y-2">
            <label x-show="!['arcs', 'universes', 'prices', 'links'].includes(field.input_type)" class="field-label" :for="fieldIdPrefix + 'value-' + field.key" x-text="'New ' + field.label"></label>
            {% for kind, entry_name in [('universes', 'universe'), ('prices', 'price'), ('links', 'link')] %}
            <template x-if="field.input_type === '{{ kind }}'">
              <div class="space-y-2">
                <template x-for="(entry, index) in editorDrafts[field.key].value" :key="entry.key">
                  <div class="flex flex-wrap items-end gap-2">
                    {% if kind == 'links' %}
                    <label class="field-label grow min-w-0">Reference URL
                      <input class="input-pb w-full" type="url" maxlength="2048" autocomplete="off" :aria-label="'Reference URL ' + (index + 1)" x-model="entry.url" @input="choicesDirty = true" :disabled="busy">
                    </label>
                    <label class="field-label"><input class="checkbox-pb" type="checkbox" :aria-label="'Primary link ' + (index + 1)" :checked="entry.primary" @change="setPrimaryLink(editorDrafts[field.key].value, entry, $event.target.checked)" :disabled="busy || field.primary_link_locked === true"> Primary</label>
                    {% elif kind == 'prices' %}
                    <label class="field-label">Country code
                      <input class="input-pb w-24" type="text" maxlength="2" autocapitalize="characters" :aria-label="'Price country ' + (index + 1)" x-model="entry.country" @input="choicesDirty = true" :disabled="busy">
                    </label>
                    <label class="field-label grow min-w-0">Amount
                      <input class="input-pb w-full" type="text" inputmode="decimal" maxlength="4096" :aria-label="'Price amount ' + (index + 1)" x-model="entry.amount" @input="choicesDirty = true" :disabled="busy">
                    </label>
                    {% else %}
                    <label class="field-label grow min-w-0">Universe name
                      <input class="input-pb w-full" type="text" maxlength="4096" :aria-label="'Universe name ' + (index + 1)" x-model="entry.name" @input="choicesDirty = true" :disabled="busy">
                    </label>
                    <label class="field-label grow min-w-0">Designation (optional)
                      <input class="input-pb w-full" type="text" maxlength="4096" :aria-label="'Universe designation ' + (index + 1)" x-model="entry.designation" @input="choicesDirty = true" :disabled="busy">
                    </label>
                    {% endif %}
                    <div class="flex flex-wrap gap-2">
                      <button type="button" class="btn-ghost btn-sm" :aria-label="'Move {{ entry_name }} ' + (index + 1) + ' up'" :disabled="busy || index === 0" @click="moveEditorRow(editorDrafts[field.key].value, index, -1)">Up</button>
                      <button type="button" class="btn-ghost btn-sm" :aria-label="'Move {{ entry_name }} ' + (index + 1) + ' down'" :disabled="busy || index === editorDrafts[field.key].value.length - 1" @click="moveEditorRow(editorDrafts[field.key].value, index, 1)">Down</button>
                      <button type="button" class="btn-ghost btn-sm" :aria-label="'Remove {{ entry_name }} ' + (index + 1)" :disabled="busy" @click="editorDrafts[field.key].value.splice(index, 1); choicesDirty = true">Remove</button>
                    </div>
                  </div>
                </template>
                <button type="button" class="btn-ghost btn-sm" :disabled="busy || editorDrafts[field.key].value.length >= 128" @click="editorDrafts[field.key].value.push({{ entry_name }}Row()); choicesDirty = true">Add {{ entry_name }} entry</button>
              </div>
            </template>
            {% endfor %}
            <template x-if="field.input_type === 'arcs'">
              <div class="space-y-2">
                <template x-for="(entry, index) in editorDrafts[field.key].value" :key="entry.key">
                  <div class="flex flex-wrap items-end gap-2">
                    <label class="field-label grow min-w-0">Arc name
                      <input class="input-pb w-full" type="text" maxlength="500" :aria-label="'Arc name ' + (index + 1)" x-model="entry.name" @input="choicesDirty = true" :disabled="busy">
                    </label>
                    <label class="field-label">Position (optional)
                      <input class="input-pb w-24" type="text" inputmode="numeric" maxlength="10" :aria-label="'Arc position ' + (index + 1)" x-model="entry.position" @input="choicesDirty = true" :disabled="busy">
                    </label>
                    <button type="button" class="btn-ghost btn-sm" :aria-label="'Remove arc ' + (index + 1)" :disabled="busy" @click="editorDrafts[field.key].value.splice(index, 1); choicesDirty = true">Remove</button>
                  </div>
                </template>
                <button type="button" class="btn-ghost btn-sm" :disabled="busy || editorDrafts[field.key].value.length >= 128" @click="editorDrafts[field.key].value.push(arcRow()); choicesDirty = true">Add arc entry</button>
              </div>
            </template>
            <template x-if="field.input_type === 'textarea' || field.input_type === 'credits'">
              <textarea class="input-pb w-full min-h-24" :id="fieldIdPrefix + 'value-' + field.key" rows="4" x-model="editorDrafts[field.key].value" @input="choicesDirty = true" :disabled="busy"></textarea>
            </template>
            <template x-if="field.allowed_values && field.allowed_values.length">
              <div>{{ dropdown_select(name="issue-editor-value", trigger_id_expression="fieldIdPrefix + 'value-' + field.key", local_model="editorDrafts[field.key].value", options_expression="field.allowed_values.map(value => ({value: value, label: editorValueLabel(field, value)}))", local_on_change="choicesDirty = true", disabled_expression="busy") }}</div>
            </template>
            <template x-if="!(field.allowed_values && field.allowed_values.length) && !['textarea', 'credits', 'arcs', 'universes', 'prices', 'links'].includes(field.input_type)">
              <input class="input-pb w-full" :id="fieldIdPrefix + 'value-' + field.key" :type="field.input_type" :inputmode="field.key === 'issue.community_rating' ? 'decimal' : null" x-model="editorDrafts[field.key].value" @input="choicesDirty = true" :disabled="busy">
            </template>
          </div>
        </div>
      </div>
    </template>
  </fieldset>
</template>
