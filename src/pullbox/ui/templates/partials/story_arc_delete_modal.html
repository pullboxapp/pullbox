<dialog x-ref="deleteDialog" aria-labelledby="arc-delete-title" class="m-auto bg-transparent p-0 text-pb-text"
        @cancel.prevent="closeDelete()" @click.self="closeDelete()">
  <div class="modal-panel library-browser-modal library-browser-modal--compact">
    <header class="modal-header">
      <h2 id="arc-delete-title" class="library-browser-modal__title"
          x-text="deletePreview ? 'Delete ' + deletePreview.name + '?' : 'Delete Story Arc?'">Delete Story Arc?</h2>
    </header>
    <div class="modal-body library-browser-modal__body space-y-3 p-5 text-sm">
      <p x-show="deletePhase === 'loading'" role="status">Loading preview...</p>
      <template x-if="deletePreview">
        <div class="space-y-3">
          <p>Permanently remove this arc and
            <span x-text="deletePreview.entries + (deletePreview.entries === 1 ? ' reading-order entry' : ' reading-order entries')"></span>.
            <span x-show="!selectionCount">No files will be moved or deleted.</span></p>
          <p x-show="!selectedSeries.length" class="text-pb-text-sec">Kept in your library:
            <span x-text="deletePreview.issues + (deletePreview.issues === 1 ? ' issue' : ' issues')"></span>,
            <span x-text="deletePreview.series + ' series'"></span>,
            <span x-text="(deletePreview.files - selectedMembers.length) + (deletePreview.files - selectedMembers.length === 1 ? ' library file' : ' library files')"></span>.
          </p>
          <p x-show="deletePreview.shared_issues && !selectionCount" class="text-pb-text-sec">
            Shared with other arcs: <span x-text="deletePreview.shared_issues"></span>. Their reading orders stay unchanged.
          </p>
          {% include "partials/story_arc_kept_comics.html" %}
          {% include "partials/story_arc_related_series.html" %}
          <section x-show="deletePreview.placements" class="space-y-2">
            <p>Managed copies or links: <span x-text="deletePreview.managed_placements"></span>.
              References: <span x-text="deletePreview.referenced_placements"></span>.
              Unselected files stay in place without further arc synchronization.</p>
            <button type="button" class="btn-secondary btn-sm" @click="togglePaths()"
                    :aria-expanded="showPaths.toString()" aria-controls="arc-delete-paths">Review arc files</button>
            <div id="arc-delete-paths" x-show="showPaths" class="space-y-2">
              <p class="text-xs text-pb-text-sec">Recorded paths, not a scan of your disk.</p>
              <ul class="space-y-2">
                <template x-for="item in pathItems" :key="item.id">
                  <li><label class="flex items-start gap-2">
                    <template x-if="item.selectable && deletePreview.cleanup_allowed">
                      <input type="checkbox" :checked="selectedPaths.includes(item.id)" :disabled="!!deletePhase || !!selectedSeries.length || (selectionCount >= 1000 && !selectedPaths.includes(item.id))"
                             @change="selectPath(item.id, $event.target.checked)" :aria-label="'Remove ' + item.path">
                    </template>
                    <span class="block break-all font-mono text-xs" x-text="item.path"></span></label>
                    <span class="text-xs text-pb-text-sec"
                          x-text="item.interrupted ? 'Interrupted removal' : item.registered ? 'Registered library file' : item.ownership === 'referenced' ? 'Referenced file' : 'Managed ' + item.mode"></span></li>
                </template>
              </ul>
              <p role="status" x-show="pathBusy">Loading arc files...</p>
              <p role="alert" x-show="pathError" x-text="pathError"></p>
              <button type="button" class="btn-secondary btn-sm" x-show="pathError" @click="loadPaths(pathRetry)">Retry file list</button>
              <nav aria-label="Arc file pages" class="flex items-center gap-2" x-show="pathNext || pathCursors.length > 1">
                <button type="button" class="btn-secondary btn-sm" :disabled="pathBusy || pathCursors.length === 1" @click="loadPaths(pathCursors.slice(0, -1))">Previous</button>
                <span x-text="'Page ' + pathCursors.length"></span>
                <button type="button" class="btn-secondary btn-sm" :disabled="pathBusy || !pathNext" @click="loadPaths([...pathCursors, pathNext])">Next</button>
              </nav>
            </div>
          </section>
          <p x-show="selectedSeries.length" x-text="selectedSeries.length + ' series selected; ' + seriesFiles.length + ' series files selected for removal.'"></p>
          <p x-show="selectedMembers.length || selectedPaths.length" x-text="selectedMembers.length + ' library files and ' + selectedPaths.length + ' separate arc files selected for removal.'"></p>
          <p x-show="selectionCount >= 1000">You can select up to 1,000 files. Unselected files stay on disk.</p>
          <template x-if="cleanupReview?.record_series">
            <section class="space-y-2" role="status" aria-label="Selected series records">
              <p x-show="!cleanupReview.paths.length">All comic files will stay on disk.</p>
              <template x-if="cleanupReview.paths.length"><div class="space-y-1">
                <p x-text="cleanupReview.trash_enabled ? 'These files will go to Trash:' : 'Trash is off. These files will be permanently removed:'"></p>
                <ul><template x-for="path in cleanupReview.paths" :key="path"><li class="break-all font-mono text-xs" x-text="path"></li></template></ul>
                <p>Cancelling stops further removals. Files already removed are not restored. Series records are deleted only after all selected files finish.</p>
              </div></template>
              <p>The arc and these series records will be permanently removed together:</p>
              <ul><template x-for="s in cleanupReview.record_series" :key="s.id">
                <li x-text="s.title + ': ' + s.issues + ' issue records, ' + s.outside + ' outside this arc, ' + (s.files - cleanupReview.removed_by_series[s.id]) + ' registered files kept on disk.'"></li>
              </template></ul>
              <template x-if="cleanupReview.shared_arcs.length">
                <div class="space-y-1">
                  <p>These other reading orders will stay, but their affected chapters will no longer link to a library issue:</p>
                  <ul><template x-for="peer in cleanupReview.shared_arcs" :key="peer.id">
                    <li x-text="peer.name + ': ' + peer.linked + (peer.linked === 1 ? ' chapter' : ' chapters')"></li>
                  </template></ul>
                  <label class="flex items-center gap-2"><input type="checkbox" x-model="allowShared" :disabled="!!deletePhase">I understand the impact on these other arcs</label>
                </div>
              </template>
            </section>
          </template>
          <template x-if="cleanupReview && !cleanupReview.record_series">
            <section class="space-y-2" aria-label="Selected removal paths" role="status">
              <p x-text="(cleanupReview.trash_enabled ? '' : 'Trash is off. ') + (selectedMembers.length ? 'Selected files' : 'Selected arc files') + (cleanupReview.trash_enabled ? ' will go to Trash.' : ' will be permanently removed.')"></p>
              <ul class="space-y-1"><template x-for="path in cleanupReview.paths" :key="path"><li class="break-all font-mono text-xs" x-text="path"></li></template></ul>
              <p>The arc is deleted only after cleanup succeeds. Cancelling stops further work; it does not undo completed removals.</p>
              <p x-show="selectedMembers.length" x-text="cleanupReview.skipped_issues + ' issues will lose their last library file and be marked skipped so they are not downloaded again. Issues with another verified copy stay owned.'"></p>
              <ul><template x-for="effect in cleanupReview.issue_effects" :key="effect.id">
                <li x-text="effect.label + (effect.remaining ? ': stays owned' : ': becomes skipped')"></li>
              </template></ul>
              <template x-if="cleanupReview.shared_arcs?.length">
                <div class="space-y-1">
                  <p>Other arcs use these comics. Removing the last copy makes the issue unavailable in their reading orders:</p>
                  <ul><template x-for="peer in cleanupReview.shared_arcs" :key="peer.id"><li x-text="peer.name"></li></template></ul>
                  <label class="flex items-center gap-2"><input type="checkbox" x-model="allowShared" :disabled="!!deletePhase">I understand the impact on these other arcs</label>
                </div>
              </template>
            </section>
          </template>
          <p x-show="deletePreview.blocker" class="text-pb-warning" role="status" x-text="deletePreview.blocker"></p>
          <a x-show="deletePreview.active_cleanup" class="btn-secondary" href="/utilities?tab=queue">View cleanup job</a>
          <template x-if="deletePreview.pending_member_cleanup">
            <div class="space-y-1"><p class="break-all" x-text="deletePreview.pending_member_cleanup.path"></p>
              <p>Pullbox restores an uncommitted removal or finishes the original Trash or delete action on the already detached file. This does not remove the arc or start another file.</p>
              <button type="button" class="btn-secondary" @click="recoverMember()" :disabled="!!deletePhase">Finish interrupted cleanup</button>
            </div>
          </template>
        </div>
      </template>
      <p x-show="deleteError" role="alert" class="text-pb-error" x-text="deleteError"></p>
      <button type="button" class="btn-secondary btn-sm" x-show="deleteError" @click="loadDeletePreview()">Refresh preview</button>
    </div>
    <footer class="modal-footer">
      <button x-ref="deleteCancel" type="button" class="btn-secondary" :disabled="deletePhase === 'deleting'" @click="closeDelete()">Cancel</button>
      <button type="button" class="btn-danger" :disabled="!!deletePhase || !!deleteError || (selectionCount ? !deletePreview?.cleanup_allowed : !deletePreview?.token) || (!!cleanupReview?.shared_arcs?.length && !allowShared)" @click="confirmDelete()"
              x-text="deletePhase === 'deleting' ? 'Submitting...' : deletePhase === 'reviewing' ? 'Reviewing...' : selectedSeries.length ? (cleanupReview ? (seriesFiles.length ? 'Delete arc, series and selected files' : 'Delete arc and selected series') : 'Review selected series') : cleanupReview ? 'Delete arc and selected files' : selectionCount ? 'Review selected files' : 'Delete arc only'">Delete arc only</button>
    </footer>
  </div>
</dialog>
