<button type="button" class="downloads-action-btn" data-testid="import-review-more-actions" id="import-review-menu-trigger-{{ item.id }}" popovertarget="import-review-menu-{{ item.id }}" aria-label="More actions for {{ item.cv_title or item.raw_series_name }}"><span aria-hidden="true">&hellip;</span></button>
<div popover id="import-review-menu-{{ item.id }}" onbeforetoggle="positionImportReviewMenu(this, event)" class="fixed inset-auto m-0 w-56 rounded-lg border border-pb-border bg-pb-card p-1.5 text-left text-pb-text shadow-xl">
  {% if item.status.value != 'skipped' %}
  <button type="button" class="btn-ghost btn-sm w-full justify-start" onclick='this.closest("[popover]").hidePopover(); return openImportCvSearchModal({jobId: {{ job.id }}, seriesId: {{ item.id }}, query: {{ item.raw_series_name|tojson|forceescape }} })'>{{ 'Change ComicVine match' if known_series_target else 'Search ComicVine' }}</button>
  {% if known_series_target %}<button type="button" class="btn-ghost btn-sm w-full justify-start" data-testid="import-review-unmatch-action" @click="$el.closest('[popover]').hidePopover(); {{ 'unmatchDuplicateSeries' if item.status.value == 'duplicate' else 'unmatchSeriesMatch' }}({{ item.id }})">Not this series</button>{% endif %}
  {% endif %}
  <button type="button" class="btn-ghost btn-sm w-full justify-start" data-import-review-expand-action aria-expanded="false" aria-controls="import-review-detail-{{ item.id }}" onclick="this.closest('[popover]').hidePopover(); toggleImportReviewRow(this)">View files</button>
  {% if series_diagnostics.get('review_series_skip') %}<button type="button" class="btn-ghost btn-sm w-full justify-start" onclick="this.closest('[popover]').hidePopover()" hx-get="/import/{{ job.id }}/series/{{ item.id }}/review-restore" hx-target="#cv-search-modal" hx-swap="innerHTML">Put back in review</button>
  {% elif item.status.value not in ('skipped', 'imported', 'confirmed') %}<button type="button" class="btn-ghost btn-sm w-full justify-start" onclick="this.closest('[popover]').hidePopover()" hx-get="/import/{{ job.id }}/series/{{ item.id }}/review-skip" hx-target="#cv-search-modal" hx-swap="innerHTML">Skip series</button>{% endif %}
</div>
