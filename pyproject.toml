[build-system]
requires = ["setuptools>=75.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "pullbox"
dynamic = ["version"]
description = "Modern comic book management and acquisition platform for self-hosted environments"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
authors = [{ name = "Adam" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "fastapi~=0.135",
    "uvicorn[standard]~=0.34",
    "sqlalchemy[asyncio]~=2.0",
    "alembic~=1.14",
    "mako>=1.3.12",  # transitive via alembic — floor for CVE-2026-44307
    "aiosqlite~=0.20",
    "pydantic~=2.13",
    "pydantic-settings~=2.7",
    "httpx~=0.28",
    "idna>=3.15",  # transitive via httpx/requests — floor for CVE-2026-45409
    "jinja2~=3.1",
    "python-multipart>=0.0.26,<0.1",
    "bcrypt>=4.2,<6.0",
    "itsdangerous~=2.2",
    "cryptography>=46.0.7",
    "defusedxml~=0.7",
    "apscheduler~=3.10",
    "starlette>=1.3.1",  # transitive via fastapi — floors for PYSEC-2026-161/CVE-2026-54282/CVE-2026-54283
    "structlog>=25.5,<27.0",
    "rarfile~=4.2",
    "py7zr~=1.1",
    "pillow~=12.1",
    "pdf2image~=1.17",
    "tzlocal~=5.3",
]

[project.optional-dependencies]
postgres = [
    "asyncpg~=0.30",
]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio~=1.3",
    "pytest-cov~=7.1",
    "pytest-httpx~=0.36",
    "pytest-xdist~=3.8",
    "ruff~=0.15",
    "mypy>=1.19,<3.0",
    "pre-commit~=4.0",
    "pip-audit~=2.7",
    "bandit~=1.9",
    "factory-boy~=3.3",
    "safety~=3.0",
    "authlib>=1.6.11",  # transitive via safety — floor for GHSA-jj8c-mmj3-mmgv
    "types-defusedxml~=0.7",
    "types-psutil~=7.2",
    "requests>=2.33.0",  # transitive (pip-audit, safety) — floor for CVE-2026-25645
    "urllib3>=2.7.0",  # transitive (requests, pip-audit, safety) — floor for CVE-2026-44431/CVE-2026-44432
]
e2e = [
    "playwright~=1.58",
    "pytest-playwright~=0.6",
]
prod = [
    "gunicorn>=25.3,<27.0",
]

[tool.setuptools.dynamic]
version = { attr = "pullbox.__version__" }

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pullbox = [
    "ui/templates/*.html",
    "ui/templates/components/*.html",
    "ui/templates/pages/*.html",
    "ui/templates/partials/*.html",
    "ui/static/css/tailwind.css",
    "ui/static/fonts/*.ttf",
    "ui/static/fonts/*.woff2",
    "ui/static/img/*.svg",
    "ui/static/js/*.js",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# E2E tests contain inline JavaScript with long lines that can't be broken,
# and string assertions that match template text using en-dashes
"tests/e2e/**" = ["E501", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["pullbox"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: Integration, API, UI, and provider tests (require DB or app fixtures)",
    "parser: Release parser tests",
    "matcher: Name matcher tests",
    "validator: Release validator tests",
    "nzbgeek: Tests using real NZBGeek fixture data",
    "regression: Bug regression tests (Phase 7 failures)",
    "cross_modality: Tests verifying disk/search consistency",
    "e2e: End-to-end browser tests (require Playwright)",
    "accessibility: Automated WCAG checks (contrast, axe, live-update behavior)",
]
