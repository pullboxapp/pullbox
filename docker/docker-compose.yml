# Pullbox — Docker Compose example
#
# Usage:
#   cp docker/.env.example .env
#   docker compose -f docker/docker-compose.yml --env-file .env up -d
#
# See docker/.env.example for the complete environment-variable reference.
# Optional PULLBOX_* overrides should be passed under environment only when you
# intentionally want the container runtime to manage that setting.
#
# config.xml is auto-generated on first run inside the /data mount.
# It contains Pullbox's application secret, so keep this appdata folder durable
# and backed up. Keep /data for Pullbox-managed state only. Mount library and
# download folders separately so database/config files are easy to inspect,
# copy, and restore without mixing them into the comic library.
#
# Recommended multi-system/NAS model:
# - Mount your shared library path at /comics
# - Mount your shared completed-downloads path at /downloads
# - Mount any manual import/drop-folder path at /imports
# - In Pullbox, keep each client's Remote Path client-specific, but set
#   Download Directory to /downloads for the normal Radarr-style setup

services:
  pullbox:
    image: ${PULLBOX_IMAGE:-ghcr.io/pullboxapp/pullbox:latest}
    container_name: pullbox
    restart: unless-stopped
    ports:
      - "${PULLBOX_HOST_PORT:-8585}:8585"
    volumes:
      - ${PULLBOX_DATA_PATH:?set PULLBOX_DATA_PATH in .env}:/data
      - ${COMICS_PATH:?set COMICS_PATH in .env}:/comics
      - ${DOWNLOADS_PATH:?set DOWNLOADS_PATH in .env}:/downloads
      - ${IMPORTS_PATH:?set IMPORTS_PATH in .env}:/imports
      # Optional native HTTPS certificate mount. Files must be readable by UID 65532.
      # - /path/to/your/certs:/config/certs:ro
    environment:
      - TZ=${TZ:-America/New_York}
      - PULLBOX_DB_URL=sqlite+aiosqlite:////data/pullbox.db
      - PULLBOX_SQLITE_JOURNAL_MODE=WAL
      - PULLBOX_LIBRARY_ROOT=/comics
      - PULLBOX_COVERS_DIR=/comics/.covers
      - PULLBOX_READER_ENABLED=${PULLBOX_READER_ENABLED:-true}
      - PULLBOX_STORY_ARC_MANUAL_CREATE_ENABLED=${PULLBOX_STORY_ARC_MANUAL_CREATE_ENABLED:-false}
      # Optional overrides (config.xml handles the rest):
      # - PULLBOX_PORT=8585
      # - PULLBOX_BASE_URL=https://comics.example.com
      # Optional application-secret override. Leave unset unless intentionally
      # managing the secret outside /data/config.xml.
      # - PULLBOX_SECRET_KEY=replace-with-a-stable-random-secret
      # Native HTTPS uses the normal Pullbox port; remap the external Docker port if needed.
      # - PULLBOX_HTTPS_ENABLED=true
      # - PULLBOX_HTTPS_CERT_PATH=/config/certs/pullbox.crt
      # - PULLBOX_HTTPS_KEY_PATH=/config/certs/pullbox.key
      # - PULLBOX_HTTPS_CERT_ROOT=/config/certs
      # Import execution tuning. Use 1 for fully serial file imports on fragile storage.
      # - PULLBOX_IMPORT_FILE_WORKER_COUNT=2
