  # Approved by Adam Hernandez on 2026-09-26 only for the exact refreshed DHI
  # runtime revisions below. These are accepted-risk exceptions, NOT fixes.
  # Pullbox now strictly normalizes valid UTF-16 and rejects malformed surrogate
  # input before its DefusedXML/Expat call sites. The libexpat1 copy also remains
  # in the PDF helper dependency closure, where it parses trusted local config,
  # not imported comic XML. Residual upstream-library risk remains until DHI
  # ships fixed packages; all other High findings continue to block.
  #
  # Re-reviewed and renewed by Adam Hernandez on 2026-10-07 ONLY for the two
  # libc6 2.41-12+deb13u4+dhi1 matches below: re-review by 2026-10-14 or the
  # next base refresh. Debian 13 has no fixed stable packages, and no direct
  # affected calls were found in Pullbox or its pinned MEGA SDK; dependency
  # reachability remains unproven. Older libc exceptions are not renewed.
  # Keep the existing Expat review deadline of 2026-10-07 or the next base
  # refresh, whichever comes first. Remove entries when fixed packages ship.
  # https://security-tracker.debian.org/tracker/CVE-2026-5435
  # https://security-tracker.debian.org/tracker/CVE-2026-19499
