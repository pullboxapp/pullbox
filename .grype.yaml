# Grype vulnerability ignore list for the Pullbox release image.
#
# Scope:
# - Docker Hardened Images Python 3.14 on Debian 13
# - Debian package findings with no fixed package or Debian "won't fix" state
# - CPython binary findings where Grype reports no stable Python 3.14 fix
#
# Python package vulnerabilities are not suppressed here; pip-audit covers
# those separately in the security workflow.
#
# Reviewed against pullbox:validate on 2026-08-25 using the current Grype DB.
# Re-audit after each DHI base-image refresh and remove entries when fixed
# stable Python 3.14 or Debian 13 packages become available upstream.

ignore:
  # Renewed by Adam Hernandez on 2026-09-14 only for this DHI libc6 revision.
  # Accepted risk, NOT a fix: Debian 13 still lists this TSIG-printing issue
  # as vulnerable/no-DSA. Direct Pullbox callers were not found, but dependency
  # reachability and DHI backport status remain unproven. Re-review by
  # 2026-09-30 or the next base refresh, whichever comes first; remove when
  # a fixed stable package ships. All other High findings remain blocking.
  # https://security-tracker.debian.org/tracker/CVE-2026-5435
  - vulnerability: CVE-2026-5435
    package:
      name: libc6
      version: 2.41-12+deb13u4+dhi0
      type: deb

  # Approved by Adam Hernandez on 2026-09-15 for this exact runtime revision.
  # Accepted risk, NOT a fix: strfmon/strfmon_l right-padding buffer overflow.
  # Debian 13 lists this as vulnerable/no-DSA with no fixed stable package.
  # No direct Pullbox callers were found; dependency reachability remains unproven.
  # Re-review by 2026-09-30 or the next base refresh, whichever comes first;
  # remove when a fixed stable package ships. All other High findings block.
  # https://security-tracker.debian.org/tracker/CVE-2026-19499
  - vulnerability: CVE-2026-19499
    package:
      name: libc6
      version: 2.41-12+deb13u4+dhi0
      type: deb

  # Renewed by Adam Hernandez on 2026-09-13 for eight exact findings in the
  # refreshed DHI runtime. These are accepted-risk exceptions, NOT fixes.
  # Keep all other High findings blocking, including other package versions.
  # Preserve the previous entries for cached images and the review dates below.
  #
  # Debian 13 still lists CVE-2026-5435 as vulnerable/no-DSA (TSIG printing).
  # No direct Pullbox calls were found, but third-party reachability and DHI
  # backport status remain unproven. Re-review by 2026-09-30 or the next base
  # refresh, whichever comes first; remove when a fixed stable package ships.
  # https://security-tracker.debian.org/tracker/CVE-2026-5435
  - vulnerability: CVE-2026-5435
    package:
      name: libc6
      version: 2.41-12+deb13u4
      type: deb

  # Debian 13 still has no fixed stable Expat package for these findings.
  # The libexpat1 copy supports Fontconfig/Poppler. The separate Python parser
  # reports Expat 2.8.2: its >=2.8.1 runtime guard does NOT establish protection
  # against these newer advisories. Do not interpret this renewal as proving
  # either parser safe. No Python-binary or libexpat1-dev exception is added.
  # Re-review by 2026-10-07 or the next base refresh, whichever comes first;
  # remove as soon as a fixed stable package is available.
  # https://security-tracker.debian.org/tracker/CVE-2026-66046
  # https://security-tracker.debian.org/tracker/CVE-2026-76956
  # https://security-tracker.debian.org/tracker/CVE-2026-76957
  - vulnerability: CVE-2026-66046
    package:
      name: libexpat1
      version: 2.8.3-1~deb13u1+dhi3
      type: deb
  - vulnerability: CVE-2026-76956
    package:
      name: libexpat1
      version: 2.8.3-1~deb13u1+dhi3
      type: deb
  - vulnerability: CVE-2026-76957
    package:
      name: libexpat1
      version: 2.8.3-1~deb13u1+dhi3
      type: deb

