# Exact accepted-risk exceptions for the Pullbox edge release image.
# Docker Hardened Images Python 3.14 on Debian 13.
#
# Approved by Adam Hernandez on 2026-10-20 for ONLY the 17 matches below.
# Accepted risk, NOT fixes or false-positive claims.
# Re-review by 2026-10-31 or the next base-image refresh, whichever comes first.
# Remove entries when verified patched stable packages become available.
# All other High/Critical findings and changed package versions remain blocking.
#
# Reviewed with Grype 0.110.0 and a fresh database on 2026-10-21 UTC:
# 17 distinct High package/CVE/version matches, zero Critical. Duplicate package
# records do not expand this approval. Obsolete exceptions have been removed.
# Refreshed system Expat 2.9.0 removes the five old Expat High findings.
# Pillow 13.0.0 fixes the eight Python image-decoder findings; no Python package
# or binary exceptions remain. Full native dependency reachability remains unproven.
# This public-release approval is separate from earlier private canary waivers.

ignore:
  # GCC PBDS erase_if and aligned-new findings. No direct Pullbox callers found;
  # native dependency reachability remains unproven. No compiler is shipped.
  # Debian 13 lists both as no-DSA, with no stable fixed package.
  # https://security-tracker.debian.org/tracker/CVE-2026-102010
  # https://security-tracker.debian.org/tracker/CVE-2026-95619
  - vulnerability: CVE-2026-102010
    package:
      name: '^gcc-14-base$'
      version: 14.2.0-19+dhi5
      type: deb
  - vulnerability: CVE-2026-102010
    package:
      name: '^libgcc-s1$'
      version: 14.2.0-19+dhi5
      type: deb
  - vulnerability: CVE-2026-102010
    package:
      name: '^libstdc\+\+6$'
      version: 14.2.0-19+dhi5
      type: deb
  - vulnerability: CVE-2026-95619
    package:
      name: '^gcc-14-base$'
      version: 14.2.0-19+dhi5
      type: deb
  - vulnerability: CVE-2026-95619
    package:
      name: '^libgcc-s1$'
      version: 14.2.0-19+dhi5
      type: deb
  - vulnerability: CVE-2026-95619
    package:
      name: '^libstdc\+\+6$'
      version: 14.2.0-19+dhi5
      type: deb

  # Deprecated TSIG printing and strfmon/strfmon_l buffer writes. No direct
  # Pullbox callers found; third-party reachability is not fully proven.
  # Debian 13 has no stable fixed package.
  # https://security-tracker.debian.org/tracker/CVE-2026-5435
  # https://security-tracker.debian.org/tracker/CVE-2026-19499
  - vulnerability: CVE-2026-5435
    package:
      name: '^libc6$'
      version: 2.41-12+deb13u4+dhi1
      type: deb
  - vulnerability: CVE-2026-19499
    package:
      name: '^libc6$'
      version: 2.41-12+deb13u4+dhi1
      type: deb

  # Source-package findings concern privileged mount/nsenter helpers. The ARM64
  # candidate contains libuuid1 but neither helper; it runs as UID/GID 65532.
  # Both release architectures still require normal image validation.
  # https://security-tracker.debian.org/tracker/CVE-2026-76642
  # https://security-tracker.debian.org/tracker/CVE-2026-78408
  # https://security-tracker.debian.org/tracker/CVE-2026-78409
  # https://security-tracker.debian.org/tracker/CVE-2026-78410
  - vulnerability: CVE-2026-76642
    package:
      name: '^libuuid1$'
      version: 2.41.5-0+deb13u1+dhi3
      type: deb
  - vulnerability: CVE-2026-78408
    package:
      name: '^libuuid1$'
      version: 2.41.5-0+deb13u1+dhi3
      type: deb
  - vulnerability: CVE-2026-78409
    package:
      name: '^libuuid1$'
      version: 2.41.5-0+deb13u1+dhi3
      type: deb
  - vulnerability: CVE-2026-78410
    package:
      name: '^libuuid1$'
      version: 2.41.5-0+deb13u1+dhi3
      type: deb

  # Non-blocking gzwrite followed by gzprintf/gzvprintf. No direct Pullbox calls
  # found; Debian still lists this package as unfixed. Do not infer immunity
  # from the runtime version string or suppress other zlib revisions.
  # https://security-tracker.debian.org/tracker/CVE-2026-85091
  - vulnerability: CVE-2026-85091
    package:
      name: '^zlib1g$'
      version: 1:1.3.dfsg+really1.3.1-1+dhi4
      type: deb

  # infocmp analyze_string stack overflow. infocmp IS present in the runtime.
  # No direct application invocation was found; this is accepted residual risk,
  # not a claim that the vulnerable executable is absent or patched.
  # https://security-tracker.debian.org/tracker/CVE-2025-69720
  - vulnerability: CVE-2025-69720
    package:
      name: '^libncursesw6$'
      version: 6.5+20250216-2+dhi4
      type: deb
  - vulnerability: CVE-2025-69720
    package:
      name: '^libtinfo6$'
      version: 6.5+20250216-2+dhi4
      type: deb
  - vulnerability: CVE-2025-69720
    package:
      name: '^ncurses-base$'
      version: 6.5+20250216-2+dhi4
      type: deb
  - vulnerability: CVE-2025-69720
    package:
      name: '^ncurses-bin$'
      version: 6.5+20250216-2+dhi4
      type: deb
