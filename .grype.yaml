# Grype vulnerability ignore list for the Pullbox release image.
#
# Scope:
# - Docker Hardened Images Python 3.14 on Debian 13
# - Debian package findings with no fixed package or Debian "won't fix" state
# - CPython binary findings where Grype reports no stable Python 3.14 fix
#
# Python package vulnerabilities are not suppressed here; pip-audit covers
# those separately in the security workflow.
#
# Reviewed against pullbox:validate on 2026-08-25 using the current Grype DB.
# Re-audit after each DHI base-image refresh and remove entries when fixed
# stable Python 3.14 or Debian 13 packages become available upstream.

ignore:
  # Approved by Adam Hernandez on 2026-10-08 for this exact package/CVE only.
  # Accepted risk, NOT a fix or a false-positive claim. CVE-2026-77214 requires
  # a caller to pass XML_ParseBuffer a length exceeding available buffer space.
  # Reviewed CPython 3.14.8 and Fontconfig 2.15.0 callers bound their lengths;
  # full shipped native dependency reachability remains unproven. Python uses
  # a separate bundled Expat; this exception does not cover Python findings.
  # Debian 13 has no fixed stable package; upstream Expat 2.9.0 contains the fix.
  # Re-review by 2026-10-14 or the next base-image refresh, whichever comes
  # first; remove when a verified patched package is available. Other versions,
  # other packages, and all other High/Critical findings remain blocking.
  # https://security-tracker.debian.org/tracker/CVE-2026-77214
  # https://github.com/libexpat/libexpat/pull/1393
  # https://github.com/python/cpython/blob/v3.14.8/Modules/pyexpat.c
  # https://sources.debian.org/src/fontconfig/2.15.0-2.3/src/fcxml.c/
  - vulnerability: CVE-2026-77214
    package:
      name: '^libexpat1$'
      version: 2.8.3-1~deb13u1+dhi5
      type: deb

  # Approved by Adam Hernandez on 2026-10-07 for ONLY these ten refreshed
  # package/advisory matches. Accepted risk, NOT upstream vulnerability fixes.
  # Re-review by 2026-10-14 or the next base-image refresh, whichever comes
  # first; remove when fixed Debian 13 packages become available. Other package
  # versions and all other High findings remain blocking.
  #
  # libexpat1 supports the Fontconfig/Poppler dependency closure. The separately
  # bundled Python parser reported Expat 2.8.5 and passed the malformed UTF-16
  # guard. This does not prove the system Expat library or its callers safe.
  # https://security-tracker.debian.org/tracker/CVE-2026-66046
  # https://security-tracker.debian.org/tracker/CVE-2026-76956
  # https://security-tracker.debian.org/tracker/CVE-2026-76957
  # https://security-tracker.debian.org/tracker/CVE-2026-93990
  - vulnerability: CVE-2026-66046
    package:
      name: '^libexpat1$'
      version: 2.8.3-1~deb13u1+dhi5
      type: deb
  - vulnerability: CVE-2026-76956
    package:
      name: '^libexpat1$'
      version: 2.8.3-1~deb13u1+dhi5
      type: deb
  - vulnerability: CVE-2026-76957
    package:
      name: '^libexpat1$'
      version: 2.8.3-1~deb13u1+dhi5
      type: deb
  - vulnerability: CVE-2026-93990
    package:
      name: '^libexpat1$'
      version: 2.8.3-1~deb13u1+dhi5
      type: deb

  # CVE-2026-102010 affects a PBDS template header. No direct PBDS/erase_if
  # callers were found in Pullbox; third-party reachability is not fully proven.
  # For CVE-2026-95619, upstream says the posix_memalign implementation is not
  # affected. The local ARM64 runtime rejected all nine upstream oversized
  # allocation cases through the nothrow aligned-new entry point. This evidence
  # does not qualify other architectures or prove every dependency safe.
  # https://security-tracker.debian.org/tracker/CVE-2026-102010
  # https://github.com/gcc-mirror/gcc/commit/aaa8351f4d2e636f9680a1f0a8ebc2f0a60611e6
  # https://security-tracker.debian.org/tracker/CVE-2026-95619
  # https://github.com/gcc-mirror/gcc/commit/59d235ffa5a69231eb42e5290d52dc8c90d28b7a
  - vulnerability: CVE-2026-102010
    package:
      name: '^gcc-14-base$'
      version: 14.2.0-19+dhi5
