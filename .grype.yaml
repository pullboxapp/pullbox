# Docker Hardened Images Python 3.14 on Debian 13.
# Approved by Adam Hernandez on 2026-11-23 for shared CI and the private lab/home rollout.
# Re-review by 2026-11-30 or the next base-image refresh, whichever comes first.
# Accepted risk, NOT fixes or false-positive claims. No public release is authorized.
# All other High/Critical findings and changed package versions remain blocking.
# Debian trixie listed each advisory as open. Native dependency reachability remains unproven.
# The pinned Grype 0.110.0 database dated 2026-11-23 reported 46 distinct High
# matches and zero Critical on arm64; verify amd64 independently before deployment.
# Explicit fix-state means a newly available package fix cannot match these rules.

